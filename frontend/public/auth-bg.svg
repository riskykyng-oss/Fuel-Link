<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050d0f"/>
      <stop offset="0.45" stop-color="#0b2020"/>
      <stop offset="0.85" stop-color="#123029"/>
      <stop offset="1" stop-color="#0a1714"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ddf247" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ddf247" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1c19" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#0c1a17"/>
      <stop offset="1" stop-color="#08110f"/>
    </linearGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#162823"/>
      <stop offset="1" stop-color="#0e1c19"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1600" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#eaf7c8">
    <circle cx="120" cy="120" r="2" opacity="0.55"/>
    <circle cx="260" cy="70" r="1.5" opacity="0.4"/>
    <circle cx="420" cy="150" r="2.2" opacity="0.5"/>
    <circle cx="560" cy="90" r="1.4" opacity="0.35"/>
    <circle cx="180" cy="260" r="1.6" opacity="0.5"/>
    <circle cx="340" cy="300" r="2" opacity="0.45"/>
    <circle cx="520" cy="240" r="1.5" opacity="0.55"/>
    <circle cx="640" cy="330" r="1.8" opacity="0.4"/>
    <circle cx="90" cy="420" r="1.4" opacity="0.5"/>
    <circle cx="460" cy="470" r="2" opacity="0.4"/>
    <circle cx="700" cy="430" r="1.5" opacity="0.35"/>
    <circle cx="820" cy="260" r="2.2" opacity="0.5"/>
    <circle cx="300" cy="180" r="1.4" opacity="0.6"/>
    <circle cx="620" cy="140" r="1.6" opacity="0.45"/>
  </g>

  <!-- moon -->
  <circle cx="700" cy="210" r="180" fill="url(#moonGlow)"/>
  <circle cx="700" cy="210" r="54" fill="#eaf7c8" opacity="0.92"/>

  <!-- skyline -->
  <g fill="#0b1816">
    <rect x="0" y="960" width="130" height="140"/>
    <rect x="150" y="900" width="110" height="200"/>
    <rect x="280" y="980" width="120" height="120"/>
    <rect x="420" y="930" width="150" height="170"/>
    <rect x="600" y="880" width="90" height="220"/>
    <rect x="710" y="950" width="140" height="150"/>
    <rect x="860" y="980" width="40" height="120"/>
  </g>
  <g fill="#17382d" opacity="0.55">
    <rect x="170" y="940" width="16" height="18"/>
    <rect x="200" y="970" width="16" height="18"/>
    <rect x="460" y="960" width="14" height="16"/>
    <rect x="520" y="990" width="14" height="16"/>
    <rect x="640" y="920" width="14" height="16"/>
  </g>

  <!-- fuel station canopy, left -->
  <g>
    <rect x="140" y="1000" width="16" height="150" fill="#0b1714"/>
    <rect x="300" y="1000" width="16" height="150" fill="#0b1714"/>
    <rect x="118" y="1016" width="220" height="34" rx="6" fill="url(#canopy)"/>
    <rect x="118" y="1046" width="220" height="7" fill="#ddf247" opacity="0.8"/>
    <rect x="150" y="1058" width="80" height="60" rx="8" fill="#0f211d"/>
    <rect x="230" y="1058" width="80" height="60" rx="8" fill="#0f211d"/>
    <rect x="162" y="1068" width="56" height="24" rx="4" fill="#ddf247" opacity="0.28"/>
    <rect x="242" y="1068" width="56" height="24" rx="4" fill="#ddf247" opacity="0.28"/>
    <rect x="150" y="1058" width="160" height="7" fill="#ddf247" opacity="0.5"/>
  </g>

  <!-- road -->
  <path d="M340 1100 L560 1100 L900 1600 L0 1600 Z" fill="url(#road)"/>
  <path d="M348 1100 L552 1100 L900 1600 L0 1600 Z" fill="none" stroke="#14231f" stroke-width="2"/>
  <g fill="#ddf247" opacity="0.4">
    <rect x="442" y="1110" width="16" height="8" rx="4"/>
    <rect x="430" y="1150" width="40" height="14" rx="7"/>
    <rect x="416" y="1200" width="68" height="22" rx="11"/>
    <rect x="398" y="1265" width="104" height="34" rx="17"/>
    <rect x="376" y="1350" width="148" height="50" rx="25"/>
    <rect x="350" y="1460" width="200" height="70" rx="35"/>
  </g>

  <!-- tanker truck -->
  <g>
    <path d="M560 1180 L560 1120 L760 1120 L760 1180 Z" fill="#0e1d19"/>
    <rect x="548" y="1172" width="240" height="26" rx="10" fill="#0a1412"/>
    <rect x="620" y="1132" width="60" height="8" fill="#ddf247" opacity="0.55"/>
    <circle cx="586" cy="1206" r="20" fill="#050c0b"/>
    <circle cx="740" cy="1206" r="20" fill="#050c0b"/>
    <rect x="536" y="1116" width="44" height="40" rx="8" fill="#0c1a16"/>
  </g>

  <!-- motorist car -->
  <g>
    <path d="M150 1270 L150 1248 L176 1236 L230 1236 L258 1248 L258 1270 Z" fill="#0d1c18"/>
    <rect x="142" y="1266" width="124" height="18" rx="9" fill="#09120f"/>
    <rect x="182" y="1244" width="12" height="9" fill="#ddf247" opacity="0.7"/>
    <rect x="212" y="1244" width="12" height="9" fill="#ddf247" opacity="0.7"/>
    <circle cx="172" cy="1290" r="14" fill="#040a09"/>
    <circle cx="238" cy="1290" r="14" fill="#040a09"/>
  </g>

  <!-- faint pole glow right -->
  <rect x="806" y="1080" width="10" height="120" fill="#0b1714"/>
  <circle cx="811" cy="1078" r="26" fill="#ddf247" opacity="0.12"/>
</svg>
